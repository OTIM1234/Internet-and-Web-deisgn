<!DOCTYPE html>
<html>
<head>
  <title>MUST Portal - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="ham.png" width="100" lenght="100">
    <h2>MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h2>
    <h3>Registration Portal</h3>

    <form action="dashboard.html" method="post">
      <label>Email Address</label>
      <input type="email" placeholder="name@example.com" required>

      <label>Password</label>
      <input type="password" placeholder="Enter your password" required>

      <button type="submit">Sign In</button>
    </form>

    <a href="#">Forgot your password?</a>
    <div class="new">
      <button onclick="window.location.href='CreateAccount.html'">Create Account</button>
      
    </div>
  </div>
</body>
</html>
